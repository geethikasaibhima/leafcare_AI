{% extends "base.html" %}

{% block title %}Page Not Found – LeafCare AI{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="scanner-icon-bubble mx-auto mb-3" style="width: 80px; height: 80px; font-size: 2rem; color: #e63946;">
      <i class="fa-solid fa-seedling-slash"></i>
    </div>
    <h1 class="display-5 fw-extrabold text-dark mb-2">404 - Leaf Not Found</h1>
    <p class="text-muted mb-4">The botanical page you are searching for does not exist or has been pruned.</p>
    <a href="{{ url_for('index') }}" class="btn btn-botanical px-4 py-2">
      <i class="fa-solid fa-house me-1"></i> Return Home
    </a>
  </div>
</div>
{% endblock %}
