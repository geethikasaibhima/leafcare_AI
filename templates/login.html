{% extends "base.html" %}

{% block title %}Sign In – LeafCare AI{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      
      <div class="text-center mb-4">
        <div class="brand-badge mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.5rem;">
          <i class="fa-solid fa-leaf"></i>
        </div>
        <h3 class="fw-extrabold text-dark">Welcome Back</h3>
        <p class="text-muted small">Sign in to track your crop disease scans and access your farm dashboard.</p>
      </div>

      <div class="card card-botanical p-4 p-md-5 border-0 shadow-lg">
        <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
          
          <div class="mb-3">
            <label for="username" class="form-label small fw-bold text-dark">Username or Email</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-user"></i></span>
              <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="demo or farmer@leafcare.ai" required autofocus>
            </div>
          </div>

          <div class="mb-4">
            <div class="d-flex justify-content-between">
              <label for="password" class="form-label small fw-bold text-dark">Password</label>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
              <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Enter your password" required>
            </div>
          </div>

          <button type="submit" class="btn btn-botanical w-100 py-3 mb-3 shadow">
            <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Sign In to Account
          </button>

          <!-- Demo account hint pill -->
          <div class="p-2 rounded-3 bg-light text-center small text-muted border">
            <i class="fa-solid fa-circle-info text-success me-1"></i> Quick Test Demo: <strong>demo</strong> / <strong>demo123</strong>
          </div>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <p class="text-muted small mb-0">
            Don't have an account yet? 
            <a href="{{ url_for('register') }}" class="text-success fw-bold text-decoration-none">Create One</a>
          </p>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
